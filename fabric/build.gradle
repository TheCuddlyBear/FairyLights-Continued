plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    // Needed if you use a 26.1+ community fork of EMI (like SEMI) from Modrinth
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

fabricApi {
    configureDataGeneration()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // No mappings block needed: MC 26.1+ is unobfuscated and uses net.fabricmc.fabric-loom

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-block:${project.cca_version}"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-item:${project.cca_version}"

    include "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-block:${project.cca_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-item:${project.cca_version}"

    // Official EMI stops at 1.21.1. Keep disabled unless pointing to a 26.1 fork on Modrinth.
    if (project.enable_emi.toBoolean()) {
        compileOnly("dev.emi:emi-fabric:${emi_version}") { transitive = false }
        localRuntime("dev.emi:emi-fabric:${emi_version}") { transitive = false }
    }

    compileOnly("mezz.jei:jei-${project.minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${project.minecraft_version}-fabric-api:${jei_version}")
    if (project.enable_jei.toBoolean()) {
        runtimeOnly("mezz.jei:jei-${project.minecraft_version}-fabric:${jei_version}")
    }
}

loom {
    // Removed duplicate bottom accessWidenerPath override so :common's access widener isn't overwritten
    def commonAw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    def fabricAw = file("src/main/resources/${mod_id}.accesswidener")
    if (commonAw.exists()) {
        accessWidenerPath.set(commonAw)
    } else if (fabricAw.exists()) {
        accessWidenerPath.set(fabricAw)
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}