# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=1.2.3
group=de.lucalabs.fairylights
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Fairy Lights
mod_author=lucalabs-de
mod_id=fairylights
license=MIT
credits=
description=Decorative string lights to light up your world!
minecraft_version_range=[26.1,26.2)

# NeoForm now uses <mc_version>-<build> (e.g., 26.1-1 or 26.1.2-1)
neo_form_version=26.1.2-1

# Parchment is no longer needed because MC 26.1+ is unobfuscated and includes Mojang parameter names.
# (Remove these lines once you remove Parchment from your build.gradle files)
# parchment_minecraft=
# parchment_version=

# Fabric
fabric_version=0.155.3+26.1.2
fabric_loader_version=0.20.1

# NeoForge (4-part version: <mc_major>.<mc_minor>.<mc_patch>.<nf_build>)
neoforge_version=26.1.2.112
neoforge_loader_version_range=[1,)

# Forge
forge_version=63.0.0
forge_loader_version_range=[63,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Dependencies
cca_version=8.0.0-alpha.5+26.1
jei_version=29.5.0.26
# Official EMI has not updated to 26.1; community forks like SEMI or EMI - Port Forward use 1.1.24+26.1.2 / 2.0.0+26.1.2
emi_version=1.1.24+26.1.2
enable_jei=true
enable_emi=false